<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Brand Background -->
  <rect width="512" height="512" rx="112" fill="#24170F"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#D6A564" stroke-width="8" stroke-opacity="0.3"/>

  <!-- AWKUM Grand Arch & Minarets Emblem -->
  <g transform="translate(106, 80) scale(3.0)" fill="#FFF9F1">
    <!-- Central Dome & Spire -->
    <path d="M50 14 C44 20 40 25 40 32 L60 32 C60 25 56 20 50 14 Z" fill="#D6A564"/>
    <rect x="42" y="33" width="16" height="4" rx="1" fill="#D6A564"/>
    <circle cx="50" cy="11" r="2.5" fill="#D6A564"/>

    <!-- Main Grand Archway -->
    <path d="M32 40 C32 34 36 32 42 32 L58 32 C64 32 68 34 68 40 L68 76 L60 76 L60 52 C60 45 55 40 50 40 C45 40 40 45 40 52 L40 76 L32 76 Z"/>

    <!-- Left Minaret & Spire -->
    <path d="M22 26 L26 26 L26 76 L20 76 L20 26 Z"/>
    <polygon points="23,17 27,26 19,26" fill="#D6A564"/>
    <rect x="18" y="38" width="8" height="2.5" rx="0.5"/>
    <rect x="18" y="56" width="8" height="2.5" rx="0.5"/>

    <!-- Right Minaret & Spire -->
    <path d="M78 26 L82 26 L82 76 L76 76 L76 26 Z"/>
    <polygon points="79,17 83,26 75,26" fill="#D6A564"/>
    <rect x="74" y="38" width="8" height="2.5" rx="0.5"/>
    <rect x="74" y="56" width="8" height="2.5" rx="0.5"/>

    <!-- Foundation Steps -->
    <rect x="14" y="78" width="72" height="4" rx="1.5" fill="#D6A564"/>
    <rect x="22" y="83" width="56" height="3.5" rx="1" fill="#D6A564"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="420" font-family="Georgia, serif" font-weight="bold" font-size="38" fill="#FFF9F1" text-anchor="middle" letter-spacing="3">AWKUM</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="20" fill="#D6A564" text-anchor="middle" letter-spacing="2">CLASSHUB</text>
</svg>
